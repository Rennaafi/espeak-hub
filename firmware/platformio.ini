; PlatformIO project for the AI voice speaker firmware (ESP32-S3)
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Bump if you hit reset loops on some ESP32-S3 boards that need a smaller
; USB CDC buffer, or switch to your exact board id if different
; (run `pio boards esp32-s3` to list options).
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0  ; Serial -> UART0 (CH343 port, COM17), not the native USB port

; lib_deps will grow in later steps (PubSubClient for MQTT, ESP32-audioI2S
; for URL streaming). Left empty for step 1 since the I2S test tone only
; needs the built-in driver/i2s.h from the ESP32 Arduino core.
lib_deps =

; oled_*.cpp / face_*.cpp / psram_*.cpp / speaker.cpp = standalone sketches, each built only by its own env
build_src_filter = +<*> -<oled_*.cpp> -<face_*.cpp> -<psram_*.cpp> -<speaker.cpp>

[env:oled-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<oled_eyes.cpp>
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.0
    fluxgarage/FluxGarage RoboEyes @ ^1.1.1

[env:oled-scan]
extends = env:oled-test
build_src_filter = -<*> +<oled_scan.cpp>

[env:oled-hello]
extends = env:oled-test
build_src_filter = -<*> +<oled_hello.cpp>

[env:face-tone]
extends = env:oled-test
build_src_filter = -<*> +<face_tone.cpp>

[env:face-wifi]
extends = env:oled-test
build_src_filter = -<*> +<face_wifi.cpp>

; octal PSRAM (N8R8): memory_type must match the chip or the board bootloops
[env:psram-test]
extends = env:esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D BOARD_HAS_PSRAM
build_src_filter = -<*> +<psram_test.cpp>

; the real firmware: face + Wi-Fi + WebSocket + audio playback (needs PSRAM flags from psram-test)
[env:speaker]
extends = env:psram-test
build_src_filter = -<*> +<speaker.cpp>
lib_deps =
    ${env:oled-test.lib_deps}
    links2004/WebSockets @ ^2.7.1

; ---- RTOS benchmark builds (../bench/README.md): same firmware + -D flags, one serial "BENCH," line per reply ----
[env:bench-v0]
extends = env:speaker
build_flags = ${env:speaker.build_flags} -D BENCH -D VARIANT=\"V0\"

; V1: StreamBuffer streaming, prebuffer P comes from each /bench header
[env:bench-v1]
extends = env:speaker
build_flags = ${env:speaker.build_flags} -D BENCH -D STREAMING -D VARIANT=\"V1\"

; V2: V1 without busy polling: loop() blocks a tick per pass (core 1), face task on a 33 ms period (core 0)
[env:bench-v2]
extends = env:speaker
build_flags = ${env:speaker.build_flags} -D BENCH -D STREAMING -D LOOP_YIELD -D FACE_PERIODIC -D VARIANT=\"V2\"

; V3: V2 with the WebSocket (loop) task above the audio task (4 > 3). Needs LOOP_YIELD: a never-blocking
; task above audio would starve it completely.
[env:bench-v3]
extends = env:speaker
build_flags = ${env:speaker.build_flags} -D BENCH -D STREAMING -D LOOP_YIELD -D FACE_PERIODIC -D NET_PRIO=4 -D VARIANT=\"V3\"

; V4: V2 with block writes to I2S (one mutex + ring send per 128 frames, not per sample)
[env:bench-v4]
extends = env:speaker
build_flags = ${env:speaker.build_flags} -D BENCH -D STREAMING -D LOOP_YIELD -D FACE_PERIODIC -D BLOCK_WRITE -D VARIANT=\"V4\"
